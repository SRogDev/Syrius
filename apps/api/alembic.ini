# Alembic configuration for Syrius API (Phase 0).
# The real URL comes from DATABASE_URL (see alembic/env.py); this value is
# only a placeholder so the file is valid on its own.
[alembic]
script_location = alembic
sqlalchemy.url = postgresql+psycopg://syrius:syrius@localhost:5432/syrius

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
