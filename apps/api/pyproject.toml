[project]
name = "syrius-api"
version = "0.1.0"
description = "Syrius API — FastAPI service for the RL Engineering Factory"
requires-python = ">=3.12"
dependencies = [
    "fastapi==0.163.0",
    "pydantic==2.14.3",
    "pydantic-settings==2.16.3",
    "sqlalchemy==2.1.8",
    "alembic==1.20.1",
    "psycopg[binary]==3.3.9",
    "uvicorn==0.54.0",
    "httpx==0.28.1",
    "gymnasium==1.4.0",
    "stable-baselines3==2.9.2",
    "torch==2.15.0",
    "langgraph==0.6.8",
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[dependency-groups]
dev = [
    "pytest==9.2.0",
    "ruff==0.17.5",
    "httpx==0.28.1",
]

[build-system]
requires = ["uv_build>=0.7.19,<0.8.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
