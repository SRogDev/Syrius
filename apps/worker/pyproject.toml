[project]
name = "syrius-worker"
version = "0.1.0"
description = "Syrius worker — background job runner for the RL Engineering Factory"
requires-python = ">=3.12"
dependencies = [
    "sqlalchemy==2.1.8",
    "psycopg[binary]==3.3.9",
]

[dependency-groups]
dev = [
    "pytest==9.2.0",
    "ruff==0.17.5",
]

[build-system]
requires = ["uv_build>=0.7.19,<0.8.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
